<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异常检测结果 - 地震流体异常检测</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">地震流体异常检测可视化平台</div>
        <div class="nav-links">
            <a href="/">数据概览</a>
            <a href="/prediction">模型预测</a>
            <a href="/anomaly" class="active">异常检测</a>
        </div>
    </nav>

    <main class="container">
        <!-- 概览卡片 -->
        <section class="stats-card">
            <div class="stat-item">
                <span class="stat-label">检出异常事件</span>
                <span class="stat-value" id="stat-events">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">已验证事件</span>
                <span class="stat-value" id="stat-verified">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">对应M4+地震</span>
                <span class="stat-value" id="stat-m4">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">对应M5+地震</span>
                <span class="stat-value" id="stat-m5">-</span>
            </div>
        </section>

        <!-- 异常得分时序 -->
        <section class="chart-section">
            <h3>CNN-LSTM 残差异常得分</h3>
            <div id="scores-chart" style="height: 400px;"></div>
        </section>

        <!-- 异常事件详情表 -->
        <section class="chart-section">
            <h3>异常事件综合判定表</h3>
            <p class="section-desc">三道关卡：① 非气象归因 → ② 震前窗口有地震 → ③ 最终判定</p>
            <div class="table-container">
                <table id="events-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>异常时段</th>
                            <th>天数</th>
                            <th>峰值</th>
                            <th>方向</th>
                            <th>降水量</th>
                            <th>归因</th>
                            <th>M4+地震</th>
                            <th>M5+地震</th>
                            <th>判定</th>
                        </tr>
                    </thead>
                    <tbody id="events-body"></tbody>
                </table>
            </div>
        </section>

        <!-- M5地震详情 -->
        <section class="chart-section">
            <h3>对应M5+地震详情</h3>
            <div id="earthquake-details"></div>
        </section>

        <!-- 敏感性分析 -->
        <section class="chart-section">
            <h3>敏感性分析 - 阈值分位数 vs 异常事件数</h3>
            <div id="sensitivity-chart" style="height: 300px;"></div>
        </section>
    </main>

    <script src="/static/js/anomaly.js"></script>
</body>
</html>
