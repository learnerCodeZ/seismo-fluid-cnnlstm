<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据概览 - 地震流体异常检测</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">地震流体异常检测可视化平台</div>
        <div class="nav-links">
            <a href="/" class="active">数据概览</a>
            <a href="/prediction">模型预测</a>
            <a href="/anomaly">异常检测</a>
        </div>
    </nav>

    <main class="container">
        <!-- 筛选栏 -->
        <section class="filter-bar">
            <div class="filter-group">
                <label>台站</label>
                <select id="station-select"></select>
            </div>
            <div class="filter-group">
                <label>测项</label>
                <select id="item-select"></select>
            </div>
        </section>

        <!-- 台站信息卡片 -->
        <section class="stats-card">
            <div class="stat-item">
                <span class="stat-label">数据天数</span>
                <span class="stat-value" id="stat-days">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">缺测率</span>
                <span class="stat-value" id="stat-missing">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">时间范围</span>
                <span class="stat-value" id="date-range">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">数据质量</span>
                <span class="stat-value" id="stat-quality">-</span>
            </div>
        </section>

        <!-- 时序曲线 -->
        <section class="chart-section">
            <h3>时序曲线</h3>
            <div id="timeseries-chart" style="height: 400px;"></div>
        </section>

        <!-- 数据统计 -->
        <section class="chart-section">
            <h3>数据质量统计</h3>
            <div class="table-container">
                <table id="stats-table">
                    <thead>
                        <tr>
                            <th>测项</th>
                            <th>天数</th>
                            <th>有效</th>
                            <th>缺测</th>
                            <th>缺测率</th>
                            <th>质量</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/js/data.js"></script>
</body>
</html>
