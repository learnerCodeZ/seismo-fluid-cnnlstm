<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震流体异常检测可视化平台</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">地震流体异常检测可视化平台</div>
        <div class="nav-links">
            <a href="#data" class="active" onclick="showTab('data')">数据概览</a>
            <a href="#prediction" onclick="showTab('prediction')">模型预测</a>
            <a href="#anomaly" onclick="showTab('anomaly')">异常检测</a>
        </div>
    </nav>

    <main class="container">
        <!-- 数据概览 -->
        <div id="data-tab" class="tab-content active">
            <section class="stats-card">
                <div class="stat-item">
                    <span class="stat-label">台站</span>
                    <span class="stat-value" id="station-name">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">数据量</span>
                    <span class="stat-value" id="stat-days">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">时间范围</span>
                    <span class="stat-value" id="date-range">-</span>
                </div>
            </section>

            <section class="chart-section">
                <h3>时序曲线</h3>
                <div id="timeseries-chart" style="height: 400px;"></div>
            </section>
        </div>

        <!-- 模型预测 -->
        <div id="prediction-tab" class="tab-content">
            <section class="chart-section">
                <h3>预测 vs 观测</h3>
                <div id="prediction-chart" style="height: 400px;"></div>
            </section>

            <section class="chart-section">
                <h3>残差图</h3>
                <div id="residual-chart" style="height: 300px;"></div>
            </section>

            <section class="chart-section">
                <h3>评估指标</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>模型</th>
                                <th>RMSE</th>
                                <th>MAE</th>
                                <th>MAPE (%)</th>
                                <th>R²</th>
                            </tr>
                        </thead>
                        <tbody id="metrics-body"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- 异常检测 -->
        <div id="anomaly-tab" class="tab-content">
            <section class="stats-card">
                <div class="stat-item">
                    <span class="stat-label">检出异常事件</span>
                    <span class="stat-value" id="stat-events">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">已验证事件</span>
                    <span class="stat-value" id="stat-verified">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">对应M4+地震</span>
                    <span class="stat-value" id="stat-m4">-</span>
                </div>
            </section>

            <section class="chart-section">
                <h3>CNN-LSTM 残差异常得分</h3>
                <div id="scores-chart" style="height: 400px;"></div>
            </section>

            <section class="chart-section">
                <h3>异常事件综合判定表</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>异常时段</th>
                                <th>天数</th>
                                <th>峰值得分</th>
                                <th>归因</th>
                                <th>M4+地震</th>
                                <th>判定</th>
                            </tr>
                        </thead>
                        <tbody id="events-body"></tbody>
                    </table>
                </div>
            </section>

            <section class="chart-section">
                <h3>敏感性分析</h3>
                <div id="sensitivity-chart" style="height: 300px;"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>基于CNN-LSTM的地震前兆水氡-水位双流体联合建模 | 大创项目</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
